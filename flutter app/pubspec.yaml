name: cardly
description: A modern digital business card management app.
publish_to: 'none' # Remove this line if you plan to publish the package

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
   sdk: flutter
  intl: any

  
  url_launcher: ^6.2.2

  # UI & Fonts
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.9
  lottie: ^3.1.2

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  hydrated_bloc: ^9.1.2
  path_provider: ^2.1.1
  crypto: ^3.0.5

  # Networking & Storage
  http: ^1.2.2
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  path: ^1.8.3

  # Image & QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  image_picker: ^1.1.2

  # Animations
  animations: ^2.0.11

  # Icons
  iconsax: ^0.0.8

  # Firebase (optional — enable later if needed)
  # firebase_core: ^3.5.0
  # firebase_auth: ^5.3.1
  # cloud_firestore: ^5.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/images/business_card_backgrounds/
    - assets/icons/
